<!Doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Apply — Application Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Nunito+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
<header class="site-header">
  <img src="img/ihi-logo.jpg" alt="Ifakara Health Institute" class="brand-logo">
  <img src="img/map-logo.png" alt="MAP Project" class="brand-logo">
  <span class="brand">Application Portal</span>
  <span class="sub">Onboarding &middot; knowledge check &amp; application</span>
  <span class="spacer"></span>
  <a class="muted" href="index.html">Home</a>
  <a class="muted" href="panel.html">Staff panel</a>
</header>

<div class="wrap">
  <ul class="steps" id="steps"></ul>

  <div class="card">
    <div id="stage"></div>
  </div>
</div>

<template id="tpl-before">
  <h1>Before you begin</h1>
  <p class="lead" data-lead></p>
  <div class="warnbox" data-cost></div>

  <h2>Have these ready</h2>
  <ol class="prep" data-requirements></ol>

  <p class="muted" data-deadline></p>
  <div class="err hidden" data-alert></div>
  <div class="actions">
    <button class="btn" data-next>Start my application</button>
    <button class="btn btn-ghost" data-print type="button">Print this list</button>
  </div>
</template>

<template id="tpl-details">
  <h1>Apply to the workshop</h1>
  <p class="lead" data-lead></p>
  <div class="warnbox">
    <strong>Please answer accurately</strong> rather than optimistically.
    A place offered to someone who cannot take it up is a place lost to another applicant.
  </div>

  <h2>Your details</h2>
  <div class="grid2">
    <div>
      <label>First name <span class="req">*</span></label>
      <input type="text" name="first_name" autocomplete="given-name">
      <div class="field-error" data-error="first_name"></div>
    </div>
    <div>
      <label>Last name <span class="req">*</span></label>
      <input type="text" name="last_name" autocomplete="family-name">
      <div class="field-error" data-error="last_name"></div>
    </div>
    <div>
      <label>Email <span class="req">*</span></label>
      <input type="email" name="email" autocomplete="email">
      <p class="hint">An institutional address is preferred where you have one.</p>
      <div class="field-error" data-error="email"></div>
    </div>
    <div>
      <label>WhatsApp number — including country code <span class="req">*</span></label>
      <input type="tel" name="phone" autocomplete="tel" placeholder="+255 712 345 678">
      <p class="hint">
        Start with <strong>+</strong> and your country code. A number beginning
        <strong>0</strong> cannot be dialled from outside your country.
      </p>
      <div class="field-error" data-error="phone"></div>
    </div>
    <div>
      <label>Country of residence <span class="req">*</span></label>
      <select name="country_of_residence" data-countries>
        <option value="">Choose…</option>
      </select>
      <div class="field-error" data-error="country_of_residence"></div>
    </div>
    <div>
      <label>Nationality <span class="req">*</span></label>
      <select name="nationality" data-countries>
        <option value="">Choose…</option>
      </select>
      <div class="field-error" data-error="nationality"></div>
    </div>
    <div>
      <label>Gender <span class="req">*</span></label>
      <select name="gender">
        <option value="">Choose…</option>
        <option>Female</option><option>Male</option>
        <option>Non-binary</option><option>Prefer not to say</option>
      </select>
      <div class="field-error" data-error="gender"></div>
    </div>
    <div>
      <label>Highest qualification <span class="req">*</span></label>
      <select name="education">
        <option value="">Choose…</option>
        <option>BSc</option><option>MSc</option><option>PhD</option><option>Other</option>
      </select>
      <div class="field-error" data-error="education"></div>
    </div>
    <div>
      <label>Institution <span class="req">*</span></label>
      <input type="text" name="institution">
      <div class="field-error" data-error="institution"></div>
    </div>
    <div>
      <label>Institution type <span class="req">*</span></label>
      <select name="institution_type">
        <option value="">Choose…</option>
        <option>University</option><option>NGO</option><option>Government</option>
        <option>Private sector</option><option>Other</option>
      </select>
      <div class="field-error" data-error="institution_type"></div>
    </div>
    <div>
      <label>Your role <span class="req">*</span></label>
      <input type="text" name="role">
      <div class="field-error" data-error="role"></div>
    </div>
    <div>
      <label>R experience <span class="req">*</span></label>
      <select name="r_experience">
        <option value="">Choose…</option>
        <option>None</option><option>Beginner</option>
        <option>Intermediate</option><option>Advanced</option>
      </select>
      <div class="field-error" data-error="r_experience"></div>
    </div>
    <div>
      <label>Bayesian knowledge <span class="req">*</span></label>
      <select name="bayesian_knowledge">
        <option value="">Choose…</option>
        <option>None</option><option>Beginner</option>
        <option>Intermediate</option><option>Advanced</option>
      </select>
      <div class="field-error" data-error="bayesian_knowledge"></div>
    </div>
  </div>
  <div class="err hidden" data-alert></div>
  <div class="actions"><button class="btn" data-next>Continue</button></div>
</template>

<template id="tpl-eligibility">
  <h1>Eligibility</h1>
  <p class="lead">
    Four practical questions. Please answer accurately — a place you cannot take up
    is a place another applicant could have used.
  </p>
  <div data-questions></div>
  <div class="note">
    We release seats only once, shortly before the workshop, so an unfilled place is
    usually a wasted one.
  </div>
  <div class="err hidden" data-alert></div>
  <div class="actions"><button class="btn" data-next>Continue</button></div>
</template>

<template id="tpl-experience">
  <h1>Your experience and plans</h1>
  <p class="lead">
    These answers help us judge whether the course suits your current work. Answer
    honestly — the course caters for a range of backgrounds and there is no advantage
    in overstating.
  </p>
  <div data-questions></div>
  <div class="err hidden" data-alert></div>
  <div class="actions"><button class="btn" data-next>Continue</button></div>
</template>

<template id="tpl-claims">
  <h1>Honesty check</h1>
  <p class="lead">Which of these R functions have you used <em>yourself</em>?</p>
  <div class="warnbox">
    <strong>Please read.</strong> Some of the names below are not real R functions.
    Claiming one costs you more than admitting you do not know it. We are not
    expecting anyone to know all of them — an accurate picture helps us support you better.
  </div>
  <table class="claim">
    <thead>
      <tr><th>Function</th><th>Used it myself</th><th>Heard of it</th><th>Don't know it</th></tr>
    </thead>
    <tbody data-rows></tbody>
  </table>
  <div class="err hidden" data-alert></div>
  <div class="actions"><button class="btn" data-next>Continue</button></div>
</template>

<template id="tpl-quiz-intro">
  <h1>Knowledge check</h1>
  <p class="lead" data-shape></p>
  <ul class="tight">
    <li><strong data-timing></strong> per question — the countdown is enforced by the server.</li>
    <li>You <strong>cannot</strong> go back, and the check cannot be restarted.</li>
    <li>Each applicant gets a <strong>different draw</strong> of questions, with the
      answer options shuffled.</li>
    <li>You are not told which answers were right — only your final score.</li>
  </ul>
  <div class="note">
    Answer from your own knowledge. The point is to place you on the course, not to
    filter people out on trivia.
  </div>
  <div class="err hidden" data-alert></div>
  <div class="actions"><button class="btn" data-next>Start the knowledge check</button></div>
</template>

<template id="tpl-question">
  <div class="qmeta">
    <span data-progress></span>
    <span class="cat" data-category></span>
    <span class="countdown" data-countdown>--</span>
  </div>
  <div class="bar"><i data-bar></i></div>
  <p class="qstem" data-stem></p>
  <pre class="code hidden" data-code></pre>
  <div data-options></div>
  <div class="actions">
    <button class="btn" data-submit disabled>Submit answer</button>
    <span class="muted" data-status></span>
  </div>
</template>

<template id="tpl-result">
  <div class="centred">
    <h1 data-title>Knowledge check complete</h1>
    <p class="score-big"><span data-score>0</span> / <span data-total>0</span></p>
    <p class="lead" data-message></p>
    <p class="muted" data-completed></p>
  </div>
  <div class="actions" data-continue-wrap style="justify-content:center">
    <button class="btn" data-next>Continue to your own work</button>
  </div>
</template>

<template id="tpl-written">
  <h1>Your own work</h1>
  <p class="lead">
    Three short answers and your CV. These are read by the selection panel — please
    answer in your own words.
  </p>

  <label>1. Describe a dataset you have personally analysed <span class="req">*</span></label>
  <p class="hint">
    Say what one row represents, roughly how many rows, the time period, and how location
    is recorded (GPS coordinates, district names, a grid, or something else). About 80 words.
  </p>
  <textarea name="written_dataset" maxlength="900"></textarea>
  <div class="field-error" data-error="written_dataset"></div>

  <label>2. Paste 5–15 lines of R code that you wrote yourself in the past year <span class="req">*</span></label>
  <p class="hint">
    Any code at all — cleaning, plotting, modelling. Add one line saying what it was for.
    If you have never written R code, write “none” — this will not disqualify you.
  </p>
  <textarea name="written_code" class="mono" maxlength="1600"></textarea>
  <div class="field-error" data-error="written_code"></div>

  <label>3. What is one feature of your own data that would make an ordinary linear
    regression a poor choice? <span class="req">*</span></label>
  <p class="hint">About 40 words.</p>
  <textarea name="written_why_not_ols" maxlength="500"></textarea>
  <div class="field-error" data-error="written_why_not_ols"></div>

  <label>4. Anything else the panel should know? <span class="opt-tag">(optional)</span></label>
  <textarea name="written_other" maxlength="600" data-words="300"></textarea>
  <p class="hint" data-counter-for="written_other"></p>
  <div class="field-error" data-error="written_other"></div>

  <h2>Motivation and expectations</h2>

  <label>5. Why do you want to take part? <span class="req">*</span></label>
  <p class="hint">Up to 300 words.</p>
  <textarea name="motivation" data-words="300"></textarea>
  <p class="hint" data-counter-for="motivation"></p>
  <div class="field-error" data-error="motivation"></div>

  <label>6. What do you expect to get out of it? <span class="req">*</span></label>
  <p class="hint">Up to 300 words.</p>
  <textarea name="expectations" data-words="300"></textarea>
  <p class="hint" data-counter-for="expectations"></p>
  <div class="field-error" data-error="expectations"></div>

  <h2>Your CV</h2>

  <label>7. Upload your CV <span class="req">*</span></label>
  <p class="hint">
    <strong>PDF only</strong>, at most <strong>2 pages</strong> and <strong>5&nbsp;MB</strong>.
    Word documents are not accepted — export to PDF first.
  </p>
  <input type="file" name="cv" accept="application/pdf,.pdf">
  <div class="field-error" data-error="cv"></div>

  <div class="err hidden" data-alert></div>
  <div class="actions"><button class="btn" data-next>Submit application</button></div>
</template>

<template id="tpl-done">
  <div class="centred">
    <h1>Application submitted</h1>
    <p class="lead">
      Thank you — your answers and CV have been received. The selection panel will be
      in touch by email.
    </p>
  </div>
</template>

<template id="tpl-stopped">
  <h1 data-title>Thank you for your interest</h1>
  <p class="lead" data-message></p>
  <p>
    We expect to run further courses. Please write to us to be added to the mailing list
    so we can tell you when the next one opens.
  </p>
</template>

<script src="js/api.js"></script>
<script src="js/applicant.js"></script>
</body>
</html>
